name: Ansible Deploy

on:
  # The validate job gates the deploy below. It runs on pull requests, where it is read,
  # and on main, where it is the gate.
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ansible-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Superseded pull request runs are safe to cancel. A run on main is not: it
  # gates the deploy job below.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Read-only gate. Runs the offline tests, then reads NetBox, builds every router's BIRD config on
  # the runner and parses it with `bird -p`. No host is contacted and nothing is changed.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NETBOX_API: ${{ secrets.NETBOX_API || secrets.NETBOX_URL }}
      NETBOX_TOKEN: ${{ secrets.NETBOX_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Ansible and Galaxy collections
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.ansible/collections
          key: ansible-${{ runner.os }}-py311-${{ hashFiles('requirements.yml', '.github/workflows/ansible-deploy.yml') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "ansible-core==2.17.*" pynetbox netaddr jinja2
          ansible-galaxy collection install -r requirements.yml
          sudo apt-get update
          sudo apt-get install -y bird2 bgpq4

      - name: Offline tests
        run: tests/run_tests.sh

      - name: Validate NetBox data and rendered configs
        run: ansible-playbook -i localhost, playbooks/validate.yml

  deploy:
    runs-on: self-hosted
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    # Merging to main deploys to production, router by router, Vultr transit first.
    environment: production
    # The production run, on the self-hosted runner. Unbounded before, which is
    # the wrong way round: a hung play here holds the runner and leaves the
    # fleet half-configured with nothing timing it out.
    timeout-minutes: 60
    env:
      ANSIBLE_HOST_KEY_CHECKING: "False"
      NETBOX_API: ${{ secrets.NETBOX_API || secrets.NETBOX_URL }}
      NETBOX_TOKEN: ${{ secrets.NETBOX_TOKEN }}
      GIT_USER_PASS: ${{ secrets.GIT_USER_PASS }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ANSIBLE_BECOME_PASS: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Elevate to root
        run: |
          echo "$GIT_USER_PASS" | sudo -S -v

      - name: Write vault password file
        run: |
          vault_file="$RUNNER_TEMP/ansible-vault-password"
          printf '%s' '${{ secrets.ANSIBLE_VAULT_PASSWORD }}' > "$vault_file"
          chmod 600 "$vault_file"

      - name: Deploy
        run: |
          vault_file="$RUNNER_TEMP/ansible-vault-password"
          echo "$GIT_USER_PASS" | sudo -S -E ansible-playbook -i inventory/netbox.yml playbooks/deploy.yml --become --vault-password-file "$vault_file"
