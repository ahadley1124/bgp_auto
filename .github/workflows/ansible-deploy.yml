name: Ansible Deploy

on:
  # Was `push: branches: "**"`, which meant every push to every working branch
  # installed Ansible, pulled the Galaxy collections and ran a --check pass
  # against live NetBox. The dry run only gates the deploy below, and that runs
  # on main alone, so it now runs where it is read: on pull requests, and on
  # main where it is the gate.
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ansible-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Superseded pull request runs are safe to cancel. A run on main is not: it
  # gates the deploy job below.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANSIBLE_HOST_KEY_CHECKING: "False"
      NETBOX_API: ${{ secrets.NETBOX_API || secrets.NETBOX_URL }}
      NETBOX_TOKEN: ${{ secrets.NETBOX_TOKEN }}
      ANSIBLE_BECOME_PASS: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Keyed on requirements.yml, which pins the collections, and with no
      # restore-keys: a partial-match restore would bring back collections from
      # an older pin, and `ansible-galaxy collection install` leaves an
      # already-installed collection alone. Exact-match only means changing a
      # pin costs one cold run and installs exactly what the file says.
      - name: Cache Ansible and Galaxy collections
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.ansible/collections
          key: ansible-${{ runner.os }}-py311-${{ hashFiles('requirements.yml', '.github/workflows/ansible-deploy.yml') }}

      - name: Install Ansible dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "ansible-core==2.17.*" pynetbox netaddr
          ansible-galaxy collection install -r requirements.yml

      - name: Write vault password file
        run: |
          vault_file="$RUNNER_TEMP/ansible-vault-password"
          printf '%s' '${{ secrets.ANSIBLE_VAULT_PASSWORD }}' > "$vault_file"
          chmod 600 "$vault_file"

      - name: Dry run deployment
        run: |
          vault_file="$RUNNER_TEMP/ansible-vault-password"
          ansible-playbook -i inventory/netbox.yml playbooks/deploy.yml --become --check --diff --vault-password-file "$vault_file"

  deploy:
    runs-on: self-hosted
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: dry-run
    # The production run, on the self-hosted runner. Unbounded before, which is
    # the wrong way round: a hung play here holds the runner and leaves the
    # fleet half-configured with nothing timing it out.
    timeout-minutes: 60
    env:
      ANSIBLE_HOST_KEY_CHECKING: "False"
      NETBOX_API: ${{ secrets.NETBOX_API || secrets.NETBOX_URL }}
      NETBOX_TOKEN: ${{ secrets.NETBOX_TOKEN }}
      GIT_USER_PASS: ${{ secrets.GIT_USER_PASS }}
      ANSIBLE_BECOME_PASS: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Elevate to root
        run: |
          echo "$GIT_USER_PASS" | sudo -S -v

      - name: Write vault password file
        run: |
          vault_file="$RUNNER_TEMP/ansible-vault-password"
          printf '%s' '${{ secrets.ANSIBLE_VAULT_PASSWORD }}' > "$vault_file"
          chmod 600 "$vault_file"

      - name: Deploy
        run: |
          vault_file="$RUNNER_TEMP/ansible-vault-password"
          echo "$GIT_USER_PASS" | sudo -S -E ansible-playbook -i inventory/netbox.yml playbooks/deploy.yml --become --vault-password-file "$vault_file"
