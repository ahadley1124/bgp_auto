name: BGP Validate

on:
  # Read-only checks only. Nothing here deploys: run playbooks/deploy.yml by hand.
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ansible-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Superseded pull request runs are safe to cancel.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Read-only gate. Runs the offline tests, then reads NetBox, builds every router's BIRD config on
  # the runner and parses it with `bird -p`. No host is contacted and nothing is changed.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NETBOX_API: ${{ secrets.NETBOX_API || secrets.NETBOX_URL }}
      NETBOX_TOKEN: ${{ secrets.NETBOX_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Ansible and Galaxy collections
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.ansible/collections
          key: ansible-${{ runner.os }}-py311-${{ hashFiles('requirements.yml', '.github/workflows/ansible-deploy.yml') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "ansible-core==2.17.*" pynetbox netaddr jinja2
          ansible-galaxy collection install -r requirements.yml
          sudo apt-get update
          sudo apt-get install -y bird2 bgpq4

      - name: Offline tests
        run: tests/run_tests.sh

      - name: Validate NetBox data and rendered configs
        run: ansible-playbook -i localhost, playbooks/validate.yml
