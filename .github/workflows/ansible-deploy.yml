name: Ansible Deploy

on:
  push:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: ansible-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dry-run:
    runs-on: ubuntu-latest
    env:
      ANSIBLE_HOST_KEY_CHECKING: "False"
      NETBOX_API: ${{ secrets.NETBOX_API || secrets.NETBOX_URL }}
      NETBOX_TOKEN: ${{ secrets.NETBOX_TOKEN }}
      ANSIBLE_BECOME_PASS: ${{ secrets.ANSIBLE_BECOME_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ansible dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "ansible-core==2.17.*" pynetbox netaddr
          ansible-galaxy collection install netbox.netbox ansible.utils

      - name: Start SSH agent
        run: |
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

      - name: Add SSH key
        run: |
          key_file="$RUNNER_TEMP/id_ed25519"
          printf '%s' '${{ secrets.SSH_PRIVATE_KEY }}' | tr -d '\r' > "$key_file"
          chmod 600 "$key_file"
          ssh-add "$key_file"

      - name: Write vault password file
        run: |
          vault_file="$RUNNER_TEMP/ansible-vault-password"
          printf '%s' '${{ secrets.ANSIBLE_VAULT_PASSWORD }}' > "$vault_file"
          chmod 600 "$vault_file"

      - name: Dry run deployment
        run: |
          vault_file="$RUNNER_TEMP/ansible-vault-password"
          ansible-playbook -i inventory/netbox.yml playbooks/deploy.yml --become --check --diff --vault-password-file "$vault_file"

  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: dry-run
    env:
      ANSIBLE_HOST_KEY_CHECKING: "False"
      NETBOX_API: ${{ secrets.NETBOX_API || secrets.NETBOX_URL }}
      NETBOX_TOKEN: ${{ secrets.NETBOX_TOKEN }}
      ANSIBLE_BECOME_PASS: ${{ secrets.ANSIBLE_BECOME_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ansible dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "ansible-core==2.17.*" pynetbox netaddr
          ansible-galaxy collection install netbox.netbox ansible.utils

      - name: Start SSH agent
        run: |
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

      - name: Add SSH key
        run: |
          key_file="$RUNNER_TEMP/id_ed25519"
          printf '%s' '${{ secrets.SSH_PRIVATE_KEY }}' | tr -d '\r' > "$key_file"
          chmod 600 "$key_file"
          ssh-add "$key_file"

      - name: Write vault password file
        run: |
          vault_file="$RUNNER_TEMP/ansible-vault-password"
          printf '%s' '${{ secrets.ANSIBLE_VAULT_PASSWORD }}' > "$vault_file"
          chmod 600 "$vault_file"

      - name: Deploy
        run: |
          vault_file="$RUNNER_TEMP/ansible-vault-password"
          ansible-playbook -i inventory/netbox.yml playbooks/deploy.yml --become --vault-password-file "$vault_file"
