bgp_as: 17290
wg_port: 51820
loopback_ip: "{{ netbox_cf_loopback_ip | ipaddr('address') }}"

# NOTE: purged_ip_prefixes is defined in playbooks/deploy.yml, not here.
# With the documented run command (-i inventory/netbox.yml playbooks/deploy.yml)
# Ansible resolves group_vars next to the inventory and next to the playbook,
# so this repo-root file is not loaded. Values here are effectively inert.

# NetBox configuration for GRE
netbox_token: "{{ vault_netbox_token }}"
netbox_url: "{{ vault_netbox_url }}"

# When true, attempt GRE tunnel creation even if facts are missing.
gre_force_create: false
