- name: Ensure BIRD directories exist
  file:
    path: "{{ item }}"
    state: directory
    mode: 0755
  loop:
    - /etc/bird
    - /etc/bird/generated

# ---- Build topology ----

- name: Build full node list
  set_fact:
    all_nodes: >-
      {{ hostvars
         | dict2items
         | selectattr('value.device_role', 'defined')
         | selectattr('value.device_role.slug', 'equalto', 'router')
         | map(attribute='key')
         | list }}

- name: Build iBGP peer list (exclude self)
  set_fact:
    bgp_peers: "{{ all_nodes | difference([inventory_hostname]) }}"

# ---- Optional: Route reflector logic ----

- name: Identify route reflectors
  set_fact:
    route_reflectors: >-
      {{ all_nodes
         | map('extract', hostvars)
         | selectattr('netbox_cf_bgp_role', 'equalto', 'rr')
         | map(attribute='inventory_hostname')
         | list }}

- name: Select effective BGP peers
  set_fact:
    effective_bgp_peers: "{{ bgp_peers if (netbox_cf_bgp_role | default('client')) == 'rr' else (route_reflectors if (route_reflectors | length > 0) else bgp_peers) }}"

# ---- Deploy configs ----

- name: Deploy BGP (iBGP mesh / RR aware)
  template:
    src: ibgp.conf.j2
    dest: /etc/bird/generated/ibgp.conf
  notify: reload bird

- name: Deploy OSPF
  template:
    src: ospf.conf.j2
    dest: /etc/bird/generated/ospf.conf
  notify: reload bird

- name: Deploy BFD
  template:
    src: bfd.conf.j2
    dest: /etc/bird/generated/bfd.conf
  notify: reload bird

# ---- Validate before reload ----

- name: Validate BIRD config
  command: bird -p -c /etc/bird/bird.conf
  register: bird_check
  changed_when: false
  failed_when: bird_check.rc != 0

# roles/bird/handlers/main.yml
- name: reload bird
  systemd:
    name: bird
    state: reloaded