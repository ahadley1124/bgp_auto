- name: Ensure BIRD directories exist
  file:
    path: "{{ item }}"
    state: directory
    mode: 0755
  loop:
    - /etc/bird
    - /etc/bird/generated

- name: Resolve peer topology from NetBox
  include_tasks: ../../common/tasks/get_netbox_peers.yml

# ---- Get loopback IP ----

- name: Get loopback IP from NetBox
  include_tasks: ../../common/tasks/get_loopback_ip.yml

- name: Sync dummyN interfaces and IPs from NetBox to Linux
  include_tasks: ../../common/tasks/sync_dummy_interfaces.yml

# ---- Deploy configs ----

- name: Deploy BGP (iBGP mesh / RR aware)
  template:
    src: ibgp.conf.j2
    dest: /etc/bird/generated/ibgp.conf
  notify: reload bird

- name: Deploy OSPF
  template:
    src: ospf.conf.j2
    dest: /etc/bird/generated/ospf.conf
  notify: reload bird

- name: Deploy connected route imports
  template:
    src: direct.conf.j2
    dest: /etc/bird/generated/direct.conf
  notify: reload bird

- name: Deploy BFD
  template:
    src: bfd.conf.j2
    dest: /etc/bird/generated/bfd.conf
  notify: reload bird

# ---- Validate before reload ----

- name: Validate BIRD config
  command: bird -p -c /etc/bird/bird.conf
  register: bird_check
  changed_when: false
  failed_when: bird_check.rc != 0

# roles/bird/handlers/main.yml
- name: reload bird
  systemd:
    name: bird
    state: reloaded
