---
- name: Set NetBox API endpoint for dummy sync
  set_fact:
    netbox_api_url: "{{ lookup('env','NETBOX_API') | default(lookup('env','NETBOX_URL'), true) }}"

- name: Query device interfaces from NetBox
  uri:
    url: "{{ netbox_api_url }}/api/dcim/interfaces/?device={{ inventory_hostname | urlencode }}&limit=0"
    headers:
      Authorization: "Token {{ lookup('env','NETBOX_TOKEN') }}"
    return_content: yes
  register: netbox_interfaces_query

- name: Filter dummyN interfaces
  set_fact:
    netbox_dummy_ifaces: "{{ netbox_interfaces_query.json.results | selectattr('name', 'match', '^dummy[0-9]+$') | list }}"

- name: Launch IP queries for dummyN interfaces
  uri:
    url: "{{ netbox_api_url }}/api/ipam/ip-addresses/?interface_id={{ item.id }}&limit=0"
    headers:
      Authorization: "Token {{ lookup('env','NETBOX_TOKEN') }}"
    return_content: yes
  loop: "{{ netbox_dummy_ifaces }}"
  loop_control:
    label: "{{ item.name }}"
  async: 60
  poll: 0
  register: netbox_dummy_ips_query_jobs

- name: Wait for dummyN IP queries
  ansible.builtin.async_status:
    jid: "{{ query_job.ansible_job_id }}"
  loop: "{{ netbox_dummy_ips_query_jobs.results | default([]) }}"
  loop_control:
    loop_var: query_job
    label: "{{ query_job.item.name | default(query_job.item.display | default('unknown')) }}"
  register: netbox_dummy_ips_query_status
  retries: 60
  delay: 1
  until: netbox_dummy_ips_query_status.finished

- name: Build dummy interface to IP map
  set_fact:
    netbox_dummy_ip_map: "{{ netbox_dummy_ip_map | default({}) | combine({ query_status.item.item.name: (((query_status.result | default(query_status)).json.results) | map(attribute='address') | list) }) }}"
  loop: "{{ netbox_dummy_ips_query_status.results | default([]) }}"
  loop_control:
    loop_var: query_status
    label: "{{ query_status.item.item.name | default(query_status.item.item.display | default('unknown')) }}"

- name: Determine dummyN IPs that fall inside purged prefixes
  set_fact:
    netbox_dummy_purged_ips: >-
      {{ netbox_dummy_purged_ips | default([])
         + (netbox_dummy_all_ips | ansible.utils.ipaddr(purge_prefix) | default([], true)) }}
  vars:
    netbox_dummy_all_ips: "{{ (netbox_dummy_ip_map | default({})).values() | list | flatten }}"
  loop: "{{ purged_ip_prefixes | default([]) }}"
  loop_control:
    loop_var: purge_prefix

- name: Warn about NetBox addresses in purged prefixes
  ansible.builtin.debug:
    msg: >-
      Skipping {{ netbox_dummy_purged_ips | length }} NetBox address(es) inside
      {{ purged_ip_prefixes | default([]) | join(', ') }}:
      {{ netbox_dummy_purged_ips | join(', ') }}.
      These are still recorded in NetBox; remove them there to stop the warning.
  when: netbox_dummy_purged_ips | default([]) | length > 0

- name: Ensure Linux dummyN interfaces exist
  shell: |
    ip link show dev {{ item.key }} >/dev/null 2>&1 || ip link add {{ item.key }} type dummy
    ip link set {{ item.key }} up
  loop: "{{ (netbox_dummy_ip_map | default({})) | dict2items }}"
  changed_when: true

- name: Ensure dummyN interface IPs exist on Linux
  shell: ip addr add {{ item.1 }} dev {{ item.0.key }} || true
  loop: "{{ ((netbox_dummy_ip_map | default({})) | dict2items) | subelements('value') }}"
  when: item.1 not in (netbox_dummy_purged_ips | default([]))
  changed_when: true
