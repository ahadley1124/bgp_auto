---
- name: Check whether BIRD is installed
  ansible.builtin.command: "which {{ bird_bin }}"
  register: bird_which
  changed_when: false
  failed_when: false

- name: Install the BIRD package
  ansible.builtin.apt:
    name: "{{ bird_package }}"
    state: present
    update_cache: true
  when: bird_which.rc != 0
