- name: Ensure WireGuard config dir
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    mode: '0700'

- name: Generate private key
  ansible.builtin.command: wg genkey
  register: wg_priv
  when: netbox_cf_wg_private_key is not defined or netbox_cf_wg_private_key == ""
  changed_when: true
  no_log: true

- name: Generate public key
  ansible.builtin.command: wg pubkey
  args:
    stdin: "{{ wg_priv.stdout }}"
  register: wg_pub
  when: wg_priv is changed
  changed_when: true
  no_log: true

- name: Validate NetBox credentials for key sync
  ansible.builtin.assert:
    that:
      - lookup('env', 'NETBOX_URL') | length > 0
      - lookup('env', 'NETBOX_TOKEN') | length > 0
    fail_msg: NETBOX_URL and NETBOX_TOKEN must be set to sync WireGuard keys to NetBox.
  when: wg_priv is changed

- name: Determine NetBox device id for key sync
  ansible.builtin.set_fact:
    netbox_target_device_id: "{{ netbox_device_id | default(id, true) }}"
  when: wg_priv is changed

- name: Validate NetBox device id for key sync
  ansible.builtin.assert:
    that:
      - netbox_target_device_id is defined
      - netbox_target_device_id | string | length > 0
    fail_msg: netbox_device_id (or id) must be present from inventory to sync WireGuard keys.
  when: wg_priv is changed

- name: Update NetBox with WG keys
  ansible.builtin.uri:
    url: "{{ lookup('env', 'NETBOX_URL') }}/api/dcim/devices/{{ netbox_target_device_id }}/"
    method: PATCH
    status_code:
      - 200
      - 204
    validate_certs: "{{ lookup('env', 'NETBOX_VALIDATE_CERTS') | default('true', true) | bool }}"
    headers:
      Authorization: "Token {{ lookup('env', 'NETBOX_TOKEN') }}"
      Content-Type: application/json
    body_format: json
    body:
      custom_fields:
        wg_private_key: "{{ wg_priv.stdout }}"
        wg_public_key: "{{ wg_pub.stdout }}"
  when: wg_priv is changed
  no_log: true

- name: Set WG keys
  ansible.builtin.set_fact:
    wg_private_key: "{{ netbox_cf_wg_private_key | default(wg_priv.stdout, true) }}"
    wg_public_key: "{{ netbox_cf_wg_public_key | default(wg_pub.stdout, true) }}"
  no_log: true

- name: Set peers
  ansible.builtin.set_fact:
    wg_peers: "{{ netbox_cf_wg_peers | default([]) }}"

- name: Deploy WireGuard config
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: /etc/wireguard/wg0.conf
    mode: '0600'
  notify: Restart WireGuard

- name: Enable WireGuard
  ansible.builtin.systemd:
    name: wg-quick@wg0
    enabled: true
    state: started
