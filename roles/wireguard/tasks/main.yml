- name: Ensure WireGuard config dir
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    mode: '0700'

- name: Generate private key
  ansible.builtin.command: wg genkey
  register: wg_priv
  when: netbox_cf_wg_private_key is not defined or netbox_cf_wg_private_key == ""
  changed_when: true
  no_log: true

- name: Generate public key
  ansible.builtin.command: wg pubkey
  args:
    stdin: "{{ wg_priv.stdout }}"
  register: wg_pub
  when: wg_priv is changed
  changed_when: true
  no_log: true

- name: Validate NetBox credentials for key sync
  ansible.builtin.assert:
    that:
      - (lookup('env', 'NETBOX_API') | default(lookup('env', 'NETBOX_URL'), true)) | length > 0
      - lookup('env', 'NETBOX_TOKEN') | length > 0
    fail_msg: NETBOX_API (or NETBOX_URL) and NETBOX_TOKEN must be set to sync WireGuard keys to NetBox.
  when: wg_priv is changed

- name: Set NetBox API endpoint for key sync
  ansible.builtin.set_fact:
    netbox_api_url: "{{ lookup('env', 'NETBOX_API') | default(lookup('env', 'NETBOX_URL'), true) }}"
  when: wg_priv is changed

- name: Query NetBox for device id by name
  ansible.builtin.uri:
    url: "{{ netbox_api_url }}/api/dcim/devices/?name={{ inventory_hostname }}"
    method: GET
    headers:
      Authorization: "Token {{ lookup('env', 'NETBOX_TOKEN') }}"
    status_code: 200
  register: netbox_device_query
  when: wg_priv is changed

- name: Determine NetBox device id for key sync
  ansible.builtin.set_fact:
    netbox_target_device_id: "{{ netbox_device_query.json.results[0].id }}"
  when: 
    - wg_priv is changed
    - netbox_device_query.json.results | length > 0

- name: Validate NetBox device query result
  ansible.builtin.assert:
    that:
      - netbox_device_query.json.results | length > 0
      - netbox_target_device_id is defined
    fail_msg: "Device '{{ inventory_hostname }}' not found in NetBox."
  when: wg_priv is changed

- name: Update NetBox with WG keys
  ansible.builtin.uri:
    url: "{{ netbox_api_url }}/api/dcim/devices/{{ netbox_target_device_id }}/"
    method: PATCH
    status_code:
      - 200
      - 204
    validate_certs: "{{ lookup('env', 'NETBOX_VALIDATE_CERTS') | default('true', true) | bool }}"
    headers:
      Authorization: "Token {{ lookup('env', 'NETBOX_TOKEN') }}"
      Content-Type: application/json
    body_format: json
    body:
      custom_fields:
        wg_private_key: "{{ wg_priv.stdout }}"
        wg_public_key: "{{ wg_pub.stdout }}"
  when: wg_priv is changed
  no_log: true

- name: Set WG keys
  ansible.builtin.set_fact:
    wg_private_key: "{{ netbox_cf_wg_private_key | default(wg_priv.stdout, true) }}"
    wg_public_key: "{{ netbox_cf_wg_public_key | default(wg_pub.stdout, true) }}"
  no_log: true

- name: Set peers
  ansible.builtin.set_fact:
    wg_peers: "{{ netbox_cf_peers | default(netbox_cf_wg_peers | default([])) }}"

- name: Set WireGuard port
  ansible.builtin.set_fact:
    wg_listen_port: "{{ wg_port_override | default(51820) }}"

- name: Deploy WireGuard config
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: /etc/wireguard/wg0.conf
    mode: '0600'
  notify: Restart WireGuard

- name: Enable WireGuard
  ansible.builtin.systemd:
    name: wg-quick@wg0
    enabled: true
    state: started
