- name: Ensure WireGuard config dir
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    mode: '0700'

- name: Generate private key
  ansible.builtin.command: wg genkey
  register: wg_priv
  when: netbox_cf_wg_private_key is not defined or netbox_cf_wg_private_key == ""
  changed_when: true

- name: Generate public key
  ansible.builtin.shell: "echo '{{ wg_priv.stdout }}' | wg pubkey"
  register: wg_pub
  when: wg_priv is changed
  changed_when: true

- name: Update NetBox with WG keys
  ansible.builtin.uri:
    url: "{{ lookup('env', 'NETBOX_URL') }}/api/dcim/devices/{{ netbox_device_id | default(id) }}/"
    method: PATCH
    headers:
      Authorization: "Token {{ lookup('env', 'NETBOX_TOKEN') }}"
      Content-Type: application/json
    body_format: json
    body:
      custom_fields:
        wg_private_key: "{{ wg_priv.stdout }}"
        wg_public_key: "{{ wg_pub.stdout }}"
  when: wg_priv is changed

- name: Set WG keys
  ansible.builtin.set_fact:
    wg_private_key: "{{ netbox_cf_wg_private_key | default(wg_priv.stdout, true) }}"
    wg_public_key: "{{ netbox_cf_wg_public_key | default(wg_pub.stdout, true) }}"

- name: Set peers
  ansible.builtin.set_fact:
    wg_peers: "{{ netbox_cf_wg_peers | default([]) }}"

- name: Deploy WireGuard config
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: /etc/wireguard/wg0.conf
    mode: '0600'

- name: Enable WireGuard
  ansible.builtin.systemd:
    name: wg-quick@wg0
    enabled: true
    state: restarted
