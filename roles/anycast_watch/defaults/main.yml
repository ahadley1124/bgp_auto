---
# Suggestions only appear for entry ASNs listed here (path ASN -> wanted share of tier-1 views).
# Example: {20473: 0.6} wants about 60% of tier-1 views to enter through Vultr (AS20473).
anycast_target_share: {}
anycast_tolerance: 0.15
anycast_max_prepend: 3
anycast_tier1_asns: [174, 209, 701, 1239, 1299, 2914, 3257, 3320, 3356, 3491, 5511, 6453, 6461, 6762, 6830, 7018, 12956]
anycast_interval: 15min
anycast_textfile_dir: /var/lib/prometheus/node-exporter
anycast_state_dir: /var/lib/bgp-auto
