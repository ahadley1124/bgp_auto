---
# ---------------------------
# Build pair identity
# ---------------------------

- name: Create pair key
  set_fact:
    gre_pair_key: "{{ [inventory_hostname, gre_peer_name] | sort | join('-') }}"

- name: Debug pair key
  debug:
    msg: "GRE pair key for {{ inventory_hostname }} and {{ gre_peer_name }} is {{ gre_pair_key }}"

# ---------------------------
# Deterministic subnet math
# ---------------------------

- name: Generate deterministic offset
  set_fact:
    gre_offset: "{{ (gre_pair_key | hash('sha1') | int(base=16)) % 60000 }}"

- name: Debug deterministic offset
  debug:
    msg: "GRE offset for {{ gre_pair_key }} is {{ gre_offset }}"

- name: Build /31 networks
  set_fact:
    gre_prefix: "10.255.{{ (gre_offset // 256) % 256 }}.{{ gre_offset % 256 }}/31"

- name: Debug /31 networks
  debug:
    msg:
      - "GRE prefix: {{ gre_prefix }}"

- name: Compute gre base nets and prefix
  set_fact:
    gre_net: "{{ gre_prefix.split('/')[0] }}"
    gre_prefix_len: "{{ gre_prefix.split('/')[1] }}"

- name: Compute gre base nets and last octets
  set_fact:
    gre_base: "{{ gre_net.split('.')[:-1] | join('.') }}"
    gre_last: "{{ gre_net.split('.')[-1] | int }}"

- name: Compute gre peer octets
  set_fact:
    gre_peer_last: "{{ ((gre_last + 1) % 256) }}"

- name: Debug computed octets
  debug:
    msg:
      - "GRE base: {{ gre_base }} last: {{ gre_last }} peer last: {{ gre_peer_last }}"

# ---------------------------
# Decide IP ownership
# ---------------------------

- name: Leader decision
  set_fact:
    gre_is_leader: "{{ inventory_hostname < gre_peer_name }}"

- name: Debug leader decision
  debug:
    msg: "GRE leader for pair {{ inventory_hostname }}/{{ gre_peer_name }} is {{ gre_is_leader }}"

- name: Assign IPs (leader)
  set_fact:
    gre_local: "{{ gre_base ~ '.' ~ (gre_last | string) ~ '/' ~ gre_prefix_len }}"
    gre_peer: "{{ gre_base ~ '.' ~ (gre_peer_last | string) ~ '/' ~ gre_prefix_len }}"
  when: gre_is_leader

- name: Assign IPs (non-leader)
  set_fact:
    gre_local: "{{ gre_base ~ '.' ~ (gre_peer_last | string) ~ '/' ~ gre_prefix_len }}"
    gre_peer: "{{ gre_base ~ '.' ~ (gre_last | string) ~ '/' ~ gre_prefix_len }}"
  when: not gre_is_leader

- name: Debug assigned IPs
  debug:
    msg:
      - "GRE local: {{ gre_local }} peer: {{ gre_peer }}"

# ---------------------------
# Tunnel names
# ---------------------------

- name: Set tunnel names
  set_fact:
    gre_tunnel_name: "{{ gre_peer_name }}-gre"

- name: Set tunnel cleanup list
  set_fact:
    gre_tunnel_cleanup:
      - "{{ gre_peer_name }}-gre"

- name: Set local IP fact
  set_fact:
    local_ip: "{{ ansible_host }}"

# Diagnostic: capture existing GRE tunnel and link state (non-destructive)
- name: Capture existing GRE tunnels and links
  shell: |
    ip -d tunnel show || true
    ip -o link show || true
  register: gre_state
  changed_when: false

- name: Debug existing GRE state
  debug:
    var: gre_state.stdout_lines

- name: Ensure stale GRE interfaces removed (with retries)
  shell: |
    if ip link show dev {{ item }} >/dev/null 2>&1; then
      ip link delete {{ item }} || true
    fi
    ip link show dev {{ item }} >/dev/null 2>&1
  register: _del_rc
  failed_when: false
  retries: 5
  delay: 1
  until: _del_rc.rc != 0
  loop: "{{ gre_tunnel_cleanup }}"
  changed_when: true

# ---------------------------
# Local interface config
# ---------------------------

- name: Ensure local interface exists
  shell: |
    ip link show dev local >/dev/null 2>&1 || ip link add local type dummy
    ip link set local up
  changed_when: true

- name: Move local IP onto local interface
  shell: |
    for iface in $(ip -o -4 addr show | awk '$4 == "{{ local_ip | ipaddr("address") }}/32" {print $2}' | sort -u); do
      if [ "$iface" != "local" ]; then
        ip addr del {{ local_ip | ipaddr('address') }}/32 dev "$iface" || true
      fi
    done
    ip addr add {{ local_ip | ipaddr('address') }}/32 dev local || true
  changed_when: true

# ---------------------------
# Loopback config
# ---------------------------

- name: Configure loopback
  shell: |
    ip addr add {{ gre_loopback_ip }}/32 dev lo || true
    ip link set lo up
  changed_when: true

# ---------------------------
# GRE tunnel config
# ---------------------------

- name: Configure GRE A
  block:
    - name: Ensure {{ gre_tunnel_name }} absent before creation
      shell: ip link show dev {{ gre_tunnel_name }} >/dev/null 2>&1 && ip tunnel del {{ gre_tunnel_name }} || true
      failed_when: false
      changed_when: true

    - name: Create GRE (with retries)
      shell: |
        ip tunnel add {{ gre_tunnel_name }} mode gre local {{ ansible_host }} remote {{ hostvars[gre_peer_name]['ansible_host'] }} ttl 255
      register: gre_add
      retries: 3
      delay: 1
      until: gre_add.rc == 0
      failed_when: gre_add.rc != 0
      changed_when: true

    - name: Verify GRE device exists
      shell: ip link show dev {{ gre_tunnel_name }} >/dev/null 2>&1
      register: gre_verify
      retries: 3
      delay: 1
      until: gre_verify.rc == 0
      failed_when: gre_verify.rc != 0

    - name: Assign IP to GRE
      shell: ip addr add {{ gre_local }} dev {{ gre_tunnel_name }} || true
      changed_when: true

    - name: Bring GRE up
      shell: ip link set {{ gre_tunnel_name }} up
      changed_when: true
