---
# ---------------------------
# Build pair identity
# ---------------------------

- name: Create pair key
  set_fact:
    gre_pair_key: "{{ [inventory_hostname, gre_peer_name] | sort | join('-') }}"
    gre_pair_description: "GRE {{ [inventory_hostname, gre_peer_name] | sort | join(' <-> ') }}"
    gre_dummy_if_name: "dummy{{ ansible_loop.index }}"

- name: Debug pair key
  debug:
    msg: "GRE pair key for {{ inventory_hostname }} and {{ gre_peer_name }} is {{ gre_pair_key }}"

# ---------------------------
# NetBox-backed /31 allocation
# ---------------------------

- name: Validate NetBox credentials for GRE prefix allocation
  assert:
    that:
      - (lookup('env', 'NETBOX_API') | default(lookup('env', 'NETBOX_URL'), true)) | length > 0
      - lookup('env', 'NETBOX_TOKEN') | length > 0
    fail_msg: NETBOX_API (or NETBOX_URL) and NETBOX_TOKEN must be set.

- name: Set NetBox API endpoint
  set_fact:
    netbox_api_url: "{{ lookup('env','NETBOX_API') | default(lookup('env','NETBOX_URL'), true) }}"

- name: Load blocked /31 prefixes from file
  set_fact:
    gre_blocked_prefixes: >-
      {{
        lookup('file', gre_blocked_prefixes_file)
        .splitlines()
        | map('trim')
        | reject('equalto', '')
        | list
      }}

- name: Lookup GRE supernet prefix object
  uri:
    url: "{{ netbox_api_url }}/api/ipam/prefixes/?prefix=10.255.0.0%2F16"
    headers:
      Authorization: "Token {{ lookup('env','NETBOX_TOKEN') }}"
    return_content: yes
  register: gre_supernet_query

- name: Validate GRE supernet exists
  assert:
    that:
      - gre_supernet_query.json.results | length > 0
    fail_msg: "NetBox prefix 10.255.0.0/16 must exist for GRE allocation."

- name: Set GRE supernet ID
  set_fact:
    gre_supernet_id: "{{ gre_supernet_query.json.results[0].id }}"

- name: Lookup existing GRE /31 by description
  uri:
    url: "{{ netbox_api_url }}/api/ipam/prefixes/?parent=10.255.0.0%2F16&prefix_length=31&description={{ gre_pair_description | urlencode }}"
    headers:
      Authorization: "Token {{ lookup('env','NETBOX_TOKEN') }}"
    return_content: yes
  register: gre_existing_prefix_query

- name: Set existing non-blocked GRE prefix (if present)
  set_fact:
    gre_existing_valid_prefix: >-
      {{
        (
          gre_existing_prefix_query.json.results
          | rejectattr('prefix', 'in', gre_blocked_prefixes)
          | map(attribute='prefix')
          | list
          | first
        ) | default('')
      }}

- name: Retire blocked GRE prefix for this pair description (leader only)
  uri:
    url: "{{ netbox_api_url }}/api/ipam/prefixes/{{ gre_existing_prefix_query.json.results[0].id }}/"
    method: PATCH
    headers:
      Authorization: "Token {{ lookup('env','NETBOX_TOKEN') }}"
      Content-Type: "application/json"
    body_format: json
    body:
      description: "{{ gre_pair_description }} [retired-blocked-10.255.0.0_23]"
    status_code: [200]
  when:
    - inventory_hostname < gre_peer_name
    - gre_existing_prefix_query.json.count | int > 0
    - gre_existing_valid_prefix | length == 0

- name: Debug next available /31 request (leader only)
  debug:
    msg:
      - "Requesting next /31 from: {{ netbox_api_url }}/api/ipam/prefixes/{{ gre_supernet_id }}/available-prefixes/"
      - "Request body: {{ {'prefix_length': 31} }}"
      - "Pair: {{ gre_pair_description }}"
  when:
    - inventory_hostname < gre_peer_name
    - gre_existing_valid_prefix | length == 0

- name: Request next available /31 candidate (leader only)
  uri:
    url: "{{ netbox_api_url }}/api/ipam/prefixes/{{ gre_supernet_id }}/available-prefixes/"
    method: POST
    headers:
      Authorization: "Token {{ lookup('env','NETBOX_TOKEN') }}"
      Content-Type: "application/json"
    body_format: json
    body:
      prefix_length: 31
    status_code: [200, 201]
    return_content: yes
  register: gre_created_prefix_candidate
  retries: 64
  delay: 0
  until: gre_created_prefix_candidate.json.prefix not in gre_blocked_prefixes
  when:
    - inventory_hostname < gre_peer_name
    - gre_existing_valid_prefix | length == 0

- name: Set description on allocated non-blocked /31 (leader only)
  uri:
    url: "{{ netbox_api_url }}/api/ipam/prefixes/{{ gre_created_prefix_candidate.json.id }}/"
    method: PATCH
    headers:
      Authorization: "Token {{ lookup('env','NETBOX_TOKEN') }}"
      Content-Type: "application/json"
    body_format: json
    body:
      description: "{{ gre_pair_description }}"
    status_code: [200]
  when:
    - inventory_hostname < gre_peer_name
    - gre_existing_valid_prefix | length == 0

- name: Re-query GRE /31 for this pair
  uri:
    url: "{{ netbox_api_url }}/api/ipam/prefixes/?parent=10.255.0.0%2F16&prefix_length=31&description={{ gre_pair_description | urlencode }}"
    headers:
      Authorization: "Token {{ lookup('env','NETBOX_TOKEN') }}"
    return_content: yes
  register: gre_prefix_query_final
  retries: 5
  delay: 1
  until: gre_prefix_query_final.json.count | int > 0

- name: Set allocated GRE prefix
  set_fact:
    gre_prefix: >-
      {{
        (
          gre_prefix_query_final.json.results
          | rejectattr('prefix', 'in', gre_blocked_prefixes)
          | map(attribute='prefix')
          | list
          | first
        )
      }}

- name: Validate non-blocked GRE prefix selected
  assert:
    that:
      - gre_prefix is defined
      - gre_prefix | length > 0
    fail_msg: "Could not find non-blocked GRE /31 for {{ gre_pair_description }}."

- name: Compute gre base nets and prefix
  set_fact:
    gre_net: "{{ gre_prefix.split('/')[0] }}"
    gre_prefix_len: "{{ gre_prefix.split('/')[1] }}"

- name: Compute gre base nets and last octets
  set_fact:
    gre_base: "{{ gre_net.split('.')[:-1] | join('.') }}"
    gre_last: "{{ gre_net.split('.')[-1] | int }}"

- name: Compute gre peer octets
  set_fact:
    gre_peer_last: "{{ ((gre_last + 1) % 256) }}"

- name: Debug computed octets
  debug:
    msg:
      - "GRE base: {{ gre_base }} last: {{ gre_last }} peer last: {{ gre_peer_last }}"

# ---------------------------
# Decide IP ownership
# ---------------------------

- name: Leader decision
  set_fact:
    gre_is_leader: "{{ inventory_hostname < gre_peer_name }}"

- name: Debug leader decision
  debug:
    msg: "GRE leader for pair {{ inventory_hostname }}/{{ gre_peer_name }} is {{ gre_is_leader }}"

- name: Assign IPs (leader)
  set_fact:
    gre_local: "{{ gre_base ~ '.' ~ (gre_last | string) ~ '/' ~ gre_prefix_len }}"
    gre_peer: "{{ gre_base ~ '.' ~ (gre_peer_last | string) ~ '/' ~ gre_prefix_len }}"
  when: gre_is_leader

- name: Assign IPs (non-leader)
  set_fact:
    gre_local: "{{ gre_base ~ '.' ~ (gre_peer_last | string) ~ '/' ~ gre_prefix_len }}"
    gre_peer: "{{ gre_base ~ '.' ~ (gre_last | string) ~ '/' ~ gre_prefix_len }}"
  when: not gre_is_leader

- name: Debug assigned IPs
  debug:
    msg:
      - "GRE local: {{ gre_local }} peer: {{ gre_peer }}"

# ---------------------------
# Ensure NetBox interfaces + IPs on dummyN
# ---------------------------

- name: Launch local device lookup
  uri:
    url: "{{ netbox_api_url }}/api/dcim/devices/?name={{ inventory_hostname | urlencode }}"
    headers:
      Authorization: "Token {{ lookup('env','NETBOX_TOKEN') }}"
    return_content: yes
  async: 60
  poll: 0
  register: gre_local_device_query_job

- name: Launch peer device lookup
  uri:
    url: "{{ netbox_api_url }}/api/dcim/devices/?name={{ gre_peer_name | urlencode }}"
    headers:
      Authorization: "Token {{ lookup('env','NETBOX_TOKEN') }}"
    return_content: yes
  async: 60
  poll: 0
  register: gre_peer_device_query_job
  when: inventory_hostname < gre_peer_name

- name: Wait for local device lookup
  ansible.builtin.async_status:
    jid: "{{ gre_local_device_query_job.ansible_job_id }}"
  register: gre_local_device_query_status
  retries: 60
  delay: 1
  until: gre_local_device_query_status.finished

- name: Wait for peer device lookup
  ansible.builtin.async_status:
    jid: "{{ gre_peer_device_query_job.ansible_job_id }}"
  register: gre_peer_device_query_status
  retries: 60
  delay: 1
  until: gre_peer_device_query_status.finished
  when: inventory_hostname < gre_peer_name

- name: Normalize NetBox device lookups
  set_fact:
    gre_local_device_query: "{{ gre_local_device_query_status.result | default(gre_local_device_query_status) }}"

- name: Normalize peer NetBox device lookup
  set_fact:
    gre_peer_device_query: "{{ gre_peer_device_query_status.result | default(gre_peer_device_query_status) }}"
  when: inventory_hostname < gre_peer_name

- name: Validate local device lookup
  assert:
    that:
      - gre_local_device_query.json.results | length > 0
    fail_msg: "Device '{{ inventory_hostname }}' not found in NetBox."

- name: Set local/peer device IDs
  set_fact:
    gre_local_device_id: "{{ gre_local_device_query.json.results[0].id }}"
    gre_peer_device_id: "{{ (gre_peer_device_query.json.results[0].id) if (inventory_hostname < gre_peer_name) else omit }}"

- name: Launch local dummy interface lookup
  uri:
    url: "{{ netbox_api_url }}/api/dcim/interfaces/?device_id={{ gre_local_device_id }}&name={{ gre_dummy_if_name }}"
    headers:
      Authorization: "Token {{ lookup('env','NETBOX_TOKEN') }}"
    return_content: yes
  async: 60
  poll: 0
  register: gre_local_dummy_iface_query_job

- name: Launch local GRE IP lookup
  uri:
    url: "{{ netbox_api_url }}/api/ipam/ip-addresses/?address={{ gre_local | urlencode }}"
    headers:
      Authorization: "Token {{ lookup('env','NETBOX_TOKEN') }}"
    return_content: yes
  async: 60
  poll: 0
  register: gre_local_ip_query_job

- name: Wait for local dummy interface lookup
  ansible.builtin.async_status:
    jid: "{{ gre_local_dummy_iface_query_job.ansible_job_id }}"
  register: gre_local_dummy_iface_query_status
  retries: 60
  delay: 1
  until: gre_local_dummy_iface_query_status.finished

- name: Normalize local dummy interface lookup
  set_fact:
    gre_local_dummy_iface_query: "{{ gre_local_dummy_iface_query_status.result | default(gre_local_dummy_iface_query_status) }}"

- name: Wait for local GRE IP lookup
  ansible.builtin.async_status:
    jid: "{{ gre_local_ip_query_job.ansible_job_id }}"
  register: gre_local_ip_query_status
  retries: 60
  delay: 1
  until: gre_local_ip_query_status.finished

- name: Normalize local GRE IP lookup
  set_fact:
    gre_local_ip_query: "{{ gre_local_ip_query_status.result | default(gre_local_ip_query_status) }}"

- name: Create local dummy interface in NetBox
  uri:
    url: "{{ netbox_api_url }}/api/dcim/interfaces/"
    method: POST
    headers:
      Authorization: "Token {{ lookup('env','NETBOX_TOKEN') }}"
      Content-Type: "application/json"
    body_format: json
    body:
      device: "{{ gre_local_device_id }}"
      name: "{{ gre_dummy_if_name }}"
      type: virtual
      description: "{{ gre_pair_description }}"
    status_code: [200, 201]
  when: gre_local_dummy_iface_query.json.count | int == 0

- name: Re-query local dummy interface
  uri:
    url: "{{ netbox_api_url }}/api/dcim/interfaces/?device_id={{ gre_local_device_id }}&name={{ gre_dummy_if_name }}"
    headers:
      Authorization: "Token {{ lookup('env','NETBOX_TOKEN') }}"
    return_content: yes
  register: gre_local_dummy_iface_final

- name: Create local GRE IP in NetBox
  uri:
    url: "{{ netbox_api_url }}/api/ipam/ip-addresses/"
    method: POST
    headers:
      Authorization: "Token {{ lookup('env','NETBOX_TOKEN') }}"
      Content-Type: "application/json"
    body_format: json
    body:
      address: "{{ gre_local }}"
      assigned_object_type: dcim.interface
      assigned_object_id: "{{ gre_local_dummy_iface_final.json.results[0].id }}"
      description: "{{ gre_pair_description }}"
      status: active
    status_code: [200, 201]
  when: gre_local_ip_query.json.count | int == 0

- name: Ensure peer dummy interface and GRE IP exist in NetBox (leader only)
  block:
    - name: Launch peer dummy interface lookup
      uri:
        url: "{{ netbox_api_url }}/api/dcim/interfaces/?device_id={{ gre_peer_device_id }}&name={{ gre_dummy_if_name }}"
        headers:
          Authorization: "Token {{ lookup('env','NETBOX_TOKEN') }}"
        return_content: yes
      async: 60
      poll: 0
      register: gre_peer_dummy_iface_query_job

    - name: Launch peer GRE IP lookup
      uri:
        url: "{{ netbox_api_url }}/api/ipam/ip-addresses/?address={{ gre_peer | urlencode }}"
        headers:
          Authorization: "Token {{ lookup('env','NETBOX_TOKEN') }}"
        return_content: yes
      async: 60
      poll: 0
      register: gre_peer_ip_query_job

    - name: Wait for peer dummy interface lookup
      ansible.builtin.async_status:
        jid: "{{ gre_peer_dummy_iface_query_job.ansible_job_id }}"
      register: gre_peer_dummy_iface_query_status
      retries: 60
      delay: 1
      until: gre_peer_dummy_iface_query_status.finished

    - name: Normalize peer dummy interface lookup
      set_fact:
        gre_peer_dummy_iface_query: "{{ gre_peer_dummy_iface_query_status.result | default(gre_peer_dummy_iface_query_status) }}"

    - name: Wait for peer GRE IP lookup
      ansible.builtin.async_status:
        jid: "{{ gre_peer_ip_query_job.ansible_job_id }}"
      register: gre_peer_ip_query_status
      retries: 60
      delay: 1
      until: gre_peer_ip_query_status.finished

    - name: Normalize peer GRE IP lookup
      set_fact:
        gre_peer_ip_query: "{{ gre_peer_ip_query_status.result | default(gre_peer_ip_query_status) }}"

    - name: Create peer dummy interface in NetBox
      uri:
        url: "{{ netbox_api_url }}/api/dcim/interfaces/"
        method: POST
        headers:
          Authorization: "Token {{ lookup('env','NETBOX_TOKEN') }}"
          Content-Type: "application/json"
        body_format: json
        body:
          device: "{{ gre_peer_device_id }}"
          name: "{{ gre_dummy_if_name }}"
          type: virtual
          description: "{{ gre_pair_description }}"
        status_code: [200, 201]
      when: gre_peer_dummy_iface_query.json.count | int == 0

    - name: Re-query peer dummy interface
      uri:
        url: "{{ netbox_api_url }}/api/dcim/interfaces/?device_id={{ gre_peer_device_id }}&name={{ gre_dummy_if_name }}"
        headers:
          Authorization: "Token {{ lookup('env','NETBOX_TOKEN') }}"
        return_content: yes
      register: gre_peer_dummy_iface_final

    - name: Create peer GRE IP in NetBox
      uri:
        url: "{{ netbox_api_url }}/api/ipam/ip-addresses/"
        method: POST
        headers:
          Authorization: "Token {{ lookup('env','NETBOX_TOKEN') }}"
          Content-Type: "application/json"
        body_format: json
        body:
          address: "{{ gre_peer }}"
          assigned_object_type: dcim.interface
          assigned_object_id: "{{ gre_peer_dummy_iface_final.json.results[0].id }}"
          description: "{{ gre_pair_description }}"
          status: active
        status_code: [200, 201]
      when: gre_peer_ip_query.json.count | int == 0
  when: inventory_hostname < gre_peer_name

# ---------------------------
# Tunnel names
# ---------------------------

- name: Set tunnel names
  set_fact:
    gre_tunnel_name: "{{ gre_peer_name }}-gre"

- name: Set tunnel cleanup list
  set_fact:
    gre_tunnel_cleanup:
      - "{{ gre_peer_name }}-gre"

- name: Set local IP fact
  set_fact:
    local_ip: "{{ ansible_host }}"

# Diagnostic: capture existing GRE tunnel and link state (non-destructive)
- name: Capture existing GRE tunnels and links
  shell: |
    ip -d tunnel show || true
    ip -o link show || true
  register: gre_state
  changed_when: false

- name: Debug existing GRE state
  debug:
    var: gre_state.stdout_lines

- name: Ensure stale GRE interfaces removed (with retries)
  shell: |
    if ip link show dev {{ item }} >/dev/null 2>&1; then
      ip link delete {{ item }} || true
    fi
    ip link show dev {{ item }} >/dev/null 2>&1
  register: _del_rc
  failed_when: false
  retries: 5
  delay: 1
  until: _del_rc.rc != 0
  loop: "{{ gre_tunnel_cleanup }}"
  changed_when: true

# ---------------------------
# Local interface config
# ---------------------------

- name: Ensure local interface exists
  shell: |
    ip link show dev local >/dev/null 2>&1 || ip link add local type dummy
    ip link set local up
  changed_when: true

# Addresses inside a purged prefix are retired network-wide, so they are never
# put back onto an interface here. The pre_tasks purge removes any that are
# already configured.
- name: Determine GRE addresses that fall inside purged prefixes
  set_fact:
    gre_purged_addresses: >-
      {{ gre_purged_addresses | default([])
         + (gre_candidate_addresses | ansible.utils.ipaddr(purge_prefix) | default([], true)) }}
  vars:
    gre_candidate_addresses: >-
      {{ [local_ip | ansible.utils.ipaddr('address'), gre_loopback_ip | default('')]
         | select | list }}
  loop: "{{ purged_ip_prefixes | default([]) }}"
  loop_control:
    loop_var: purge_prefix

- name: Move local IP onto local interface
  shell: |
    for iface in $(ip -o -4 addr show | awk '$4 == "{{ local_ip | ipaddr("address") }}/32" {print $2}' | sort -u); do
      if [ "$iface" != "local" ]; then
        ip addr del {{ local_ip | ipaddr('address') }}/32 dev "$iface" || true
      fi
    done
    ip addr add {{ local_ip | ipaddr('address') }}/32 dev local || true
  when: (local_ip | ansible.utils.ipaddr('address')) not in (gre_purged_addresses | default([]))
  changed_when: true

# ---------------------------
# Loopback config
# ---------------------------

- name: Configure loopback
  shell: |
    ip addr add {{ gre_loopback_ip }}/32 dev lo || true
    ip link set lo up
  when: (gre_loopback_ip | default('')) not in (gre_purged_addresses | default([]))
  changed_when: true

# ---------------------------
# GRE tunnel config
# ---------------------------

- name: Configure GRE A
  block:
    - name: Ensure {{ gre_tunnel_name }} absent before creation
      shell: ip link show dev {{ gre_tunnel_name }} >/dev/null 2>&1 && ip tunnel del {{ gre_tunnel_name }} || true
      failed_when: false
      changed_when: true

    - name: Create GRE (with retries)
      shell: |
        ip tunnel add {{ gre_tunnel_name }} mode gre local {{ ansible_host }} remote {{ hostvars[gre_peer_name]['ansible_host'] }} ttl 255
      register: gre_add
      retries: 3
      delay: 1
      until: gre_add.rc == 0
      failed_when: gre_add.rc != 0
      changed_when: true

    - name: Verify GRE device exists
      shell: ip link show dev {{ gre_tunnel_name }} >/dev/null 2>&1
      register: gre_verify
      retries: 3
      delay: 1
      until: gre_verify.rc == 0
      failed_when: gre_verify.rc != 0

    - name: Assign IP to GRE
      shell: ip addr add {{ gre_local }} dev {{ gre_tunnel_name }} || true
      changed_when: true

    - name: Bring GRE up
      shell: ip link set {{ gre_tunnel_name }} up
      changed_when: true

    - name: Set Tunnel MTU
      shell: ip link set {{ gre_tunnel_name }} mtu 1400
      changed_when: true
