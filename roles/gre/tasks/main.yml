---
# ---------------------------
# Get loopback IP
# ---------------------------

- name: Resolve peer topology from NetBox
  include_tasks: ../../common/tasks/get_netbox_peers.yml

- name: Get loopback interface
  uri:
    url: "{{ lookup('env','NETBOX_API') | default(lookup('env','NETBOX_URL'), true) }}/api/dcim/interfaces/?device={{ inventory_hostname | urlencode }}&name=lo"
    headers:
      Authorization: "Token {{ lookup('env','NETBOX_TOKEN') }}"
  register: lo_iface

- name: Get loopback IP
  ansible.builtin.uri:
    url: "{{ lookup('env','NETBOX_API') | default(lookup('env','NETBOX_URL'), true) }}/api/ipam/ip-addresses/?interface_id={{ lo_iface.json.results[0].id }}"
    headers:
      Authorization: "Token {{ lookup('env','NETBOX_TOKEN') }}"
  register: lo_ip
  when: lo_iface.json.results | length > 0

- name: Set loopback fact
  set_fact:
    gre_loopback_ip: "{{ lo_ip.json.results[0].address.split('/')[0] }}"
  when: lo_ip.json.results | length > 0

- name: Set GRE peers
  set_fact:
    gre_peers: "{{ effective_bgp_peers | default([]) }}"

- name: Stop if no peers
  meta: end_host
  when: gre_peers | length == 0

# ---------------------------
# Configure GRE per peer
# ---------------------------

- name: Configure GRE tunnels
  include_tasks: gre_peer.yml
  loop: "{{ gre_peers }}"
  loop_control:
    loop_var: gre_peer_name
    extended: true

- name: Sync dummyN interfaces and IPs from NetBox to Linux
  include_tasks: ../../common/tasks/sync_dummy_interfaces.yml
