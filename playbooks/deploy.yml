- hosts: "{{ device_name | default('all') }}"
  become: true
  gather_facts: false
  strategy: free
  # group_vars/all.yml is not on Ansible's group_vars search path for this repo
  # layout (it resolves group_vars next to the inventory and next to the
  # playbook), so shared settings are loaded explicitly here.
  vars_files:
    - ../group_vars/all.yml
  pre_tasks:
    - name: Show supported deployment options
      ansible.builtin.debug:
        msg:
          - "Supported extra vars:"
          - "  device_name=<host>      Deploy to one inventory host instead of all hosts."
          - "  bgp_as=<asn>            Override the default BGP AS number."
          - "  local_ip=<ip>           Override the local service IP used by GRE."
          - "  gre_force_create=true   Allow GRE creation even when NetBox data is incomplete."
          - "  purged_ip_prefixes=[..] Override the prefixes purged from every host."
          - ""
          - "Shared settings live in group_vars/all.yml (loaded via vars_files)."
          - ""
          - "Supported environment variables:"
          - "  NETBOX_API or NETBOX_URL   NetBox API endpoint."
          - "  NETBOX_TOKEN               NetBox API token."
          - "  BGP_AUTO_LOCAL_MACHINE     Inventory hostname that should use a local Ansible connection."
          - ""
          - "Current deploy playbook roles:"
          - "  bird"
          - "  gre"
          - ""
          - "Example runs:"
          - "  ansible-playbook -i inventory/netbox.yml playbooks/deploy.yml --become"
          - "  ansible-playbook -i inventory/netbox.yml playbooks/deploy.yml --become -e device_name=router01"
          - "  ansible-playbook -i inventory/netbox.yml playbooks/deploy.yml --become --check"
          - ""
          - "To enforce retired prefixes without deploying BIRD/GRE config:"
          - "  ansible-playbook -i inventory/netbox.yml playbooks/purge_ips.yml --become"
      run_once: true
      delegate_to: localhost

    # `apply` is required so the included tasks also carry the `always` tag;
    # a dynamic include does not pass its own tags down to its children.
    - name: Purge retired IP prefixes from this host
      ansible.builtin.include_tasks:
        file: ../roles/common/tasks/purge_ip_prefixes.yml
        apply:
          tags: always
      when: purged_ip_prefixes | default([]) | length > 0
      tags: always
  roles:
    - role: bird
      tags: bird
    - role: gre
      tags: gre
