plugin: netbox.netbox.nb_inventory

group_by:
  - device_roles

compose:
  ansible_host: primary_ip.address | ipaddr('address')
  loopback_ip: interfaces | selectattr('name', 'equalto', 'lo') | map(attribute='ip_addresses') | first | default([]) | map(attribute='address') | first | default('') | ipaddr('address')

config_context: true
